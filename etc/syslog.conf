# Patchlevel: syslog.conf_1.1
#
# selector<TAB>action
#
# selector: facility.level [; facility.level]...
#
# facility: 
#
#	user	- the default facility
#
#	kern	- Messages originating in the kernel
#
#	mail	- The mail system.
#
#	daemon	- System daemons such as ftpd, routed, etc
#
#	auth	- Authorization system: login, su, etc
#
#	lpr	- Line printer system.
#
#	news	- Netnews (aka Usenet)
#
#	uucp	- Reserved for UUCP (not currently used)
#
#	cron	- Cron/At facility: crontab, at, cron
#
#	local0	- locally defined facility
#	local1	- locally defined facility
#	local2	- locally defined facility
#	local3	- locally defined facility
#	local4	- locally defined facility
#	local5	- locally defined facility
#	local6	- locally defined facility
#	local7	- locally defined facility
#
#	mark	- Internal syslog timestamp marker
#
#	*	- Everything BUT the mark facility
#
# level:
#	emerg	- Panic conditions that would otherwise be broadcast
#	alert	- Conditions requiring immediate intervention
#	crit	- Critical conditions such as disk errors 
#	err	- Other errors
#	warning	- Warning messages
#	notice	- Non-crisis conditions that may require special handling
#	info	- Informational messages
#	debug	- Debugging messages
#	none	- Do not send messages
#
#	EX:  *.debug;mail.none	means debug messages from everyone but mail
#
# action: <filename>		- append to <filename>
# action: @<host>		- forward to <host>
# action: <user>[,<user>]...	- write to <user>...
# action: *			- broadcast message
#
kern.emerg;kern.alert;kern.crit;kern.err;kern.warning	/var/log/kernel
kern.notice;kern.info;kern.debug	/var/log/bus-errors
auth.emerg;auth.alert;auth.crit;auth.err;auth.warning;auth.notice;auth.info;auth.debug	/var/log/security
news.emerg;news.alert;news.crit;news.err;news.warning	/var/log/news-urgent
*.notice;kern.none	/var/log/notice
*.crit	/var/log/critical
kern,mark.debug	/dev/console
*.emerg	*
*.alert	root
*.alert	/var/log/alert
